<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BD Country News Ticker</title>
<script src="https://cdn.jsdelivr.net/npm/monday-sdk-js/dist/main.js"></script>
<style>
  :root {
    --bg: #0b1220;
    --bg-2: #101a2e;
    --fg: #e8edf7;
    --muted: #7c8aab;
    --accent: #ff5a3c;   /* Blue Aerospace-ish signal orange, swap for real brand color */
    --line: #1e2a44;
    --live-dot: #34d399;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  /* Fixed-height bar pinned to the top of whatever box monday gives this
     widget. Height is now a fixed value (not 100%) so the bar stays a
     slim ticker even when the widget's box on the dashboard is much
     taller than it needs to be — the rest of that box just shows the
     dark background instead of stretching the label into a huge shape. */
  .ticker-shell {
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: stretch;
    width: 100%;
    height: 56px;
    background: linear-gradient(180deg, var(--bg-2), var(--bg));
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }

  .ticker-label {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    background: var(--accent);
    color: #1a0d08;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    z-index: 2;
    clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
    padding-right: 28px;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--live-dot);
    box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
    animation: pulse 1.8s infinite;
    flex: 0 0 auto;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
    70%  { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
    100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }

  .ticker-track-wrap {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  .ticker-track {
    display: flex;
    align-items: center;
    white-space: nowrap;
    will-change: transform;
    animation: scroll-left linear infinite;
    padding-left: 100%;
  }

  .ticker-track.paused { animation-play-state: paused; }

  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
  }

  .ticker-item {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    padding: 0 32px;
    font-size: 19px;
    color: var(--fg);
  }

  .ticker-item .flag-country {
    font-weight: 700;
    color: #ffd7c9;
    letter-spacing: 0.03em;
  }

  .ticker-item .headline {
    color: var(--fg);
  }

  .ticker-item .sep {
    color: var(--muted);
    margin: 0 6px;
  }

  .ticker-status {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    border-left: 1px solid var(--line);
  }

  .ticker-status button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    line-height: 1;
  }
  .ticker-status button:hover { color: var(--fg); }

  .empty-state, .error-state {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 12px;
    color: var(--muted);
  }

  .error-state { color: #ff8a75; }

  /* Message overlay sits on top of the track instead of replacing it, so
     the track element survives an error and can render on the next
     successful fetch. */
  .ticker-msg {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    padding: 0 16px;
    font-size: 14px;
    color: var(--muted);
    background: var(--bg);
    z-index: 1;
  }
  .ticker-msg.show { display: flex; }
  .ticker-msg.error { color: #ff8a75; }
</style>
</head>
<body>

<div class="ticker-shell" id="shell">
  <div class="ticker-label">
    <span class="live-dot"></span>
    <span>Country News</span>
  </div>

  <div class="ticker-track-wrap" id="trackWrap">
    <div class="ticker-track" id="track"></div>
    <div class="ticker-msg" id="msg"></div>
  </div>

  <div class="ticker-status" id="status">
    <span id="statusText">Loading…</span>
    <button id="pauseBtn" title="Pause / resume scrolling">⏸</button>
  </div>
</div>

<script>
(function () {
  // ---------------------------------------------------------------------
  // Backend URL: monday's client-side SDK can no longer make GraphQL calls
  // directly (monday.api() was removed from the browser SDK and moved
  // server-side), so this widget calls a tiny monday-code backend instead,
  // which holds the real API token in monday's encrypted Secrets store and
  // proxies the board query. Fill this in with the URL printed by
  // `mapps code:push` (or shown on the app's "Server-side code" page)
  // after the bd-news-ticker-backend project is deployed.
  // ---------------------------------------------------------------------
  var BACKEND_URL = "https://de0c7-service-36408021-b9fae46a.us.monday.app";

  var monday = window.mondaySdk ? mondaySdk() : null;

  var state = {
    boardIds: [],
    countries: [],   // configured filter, lowercase, no flag emoji
    speedPxPerSec: 60,
    refreshMs: 3 * 60 * 1000,
    itemLimit: 40,
    paused: false
  };

  var track = document.getElementById("track");
  var msgEl = document.getElementById("msg");
  var statusText = document.getElementById("statusText");
  var pauseBtn = document.getElementById("pauseBtn");
  var refreshTimer = null;
  var activeFetchToken = 0;
  var retryTimer = null;
  var retryCount = 0;
  var RETRY_DELAYS_MS = [5000, 15000, 30000, 60000];
  // monday-code backends scale to zero when idle; the first request after
  // a quiet period can take 15s+ while the container cold-starts. Allow a
  // generous timeout and retry instead of failing on the first slow call.
  var REQUEST_TIMEOUT_MS = 45000;
  var fetchDebounce = null;

  pauseBtn.addEventListener("click", function () {
    state.paused = !state.paused;
    track.classList.toggle("paused", state.paused);
    pauseBtn.textContent = state.paused ? "▶" : "⏸";
  });

  // Common alternate spellings so "USA", "Republic of Korea", "Türkiye"
  // etc. in the settings or group titles still match.
  var COUNTRY_ALIASES = {
    "usa": "united states", "us": "united states", "united states of america": "united states",
    "uk": "united kingdom", "great britain": "united kingdom",
    "korea": "south korea", "republic of korea": "south korea", "rok": "south korea",
    "türkiye": "turkey", "turkiye": "turkey",
    "uae": "united arab emirates", "emirates": "united arab emirates",
    "ksa": "saudi arabia", "republic of china": "taiwan"
  };

  function normalizeCountry(name) {
    var n = (name || "").trim().toLowerCase();
    return COUNTRY_ALIASES[n] || n;
  }

  function parseCountryList(raw) {
    if (!raw) return [];
    return raw.split(",")
      .map(function (s) { return normalizeCountry(s); })
      .filter(Boolean);
  }

  // Group titles vary by board — some use a flag emoji ("🇺🇸 United States"),
  // others use a two/three-letter country code instead ("US United States",
  // "MX Mexico"). Strip whichever prefix is present so we're left with just
  // the plain country name to compare against the configured list.
  function bareCountryName(title) {
    var name = (title || "").trim();
    // Strip a leading flag emoji or other non-letter symbols.
    name = name.replace(/^[^\p{L}]+/u, "");
    // Strip a leading all-caps country/region code (e.g. "US ", "MX ", "KR ")
    // when followed by the actual name.
    name = name.replace(/^[A-Z]{2,3}\s+/, "");
    return name.trim().toLowerCase();
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function setStatus(text) {
    statusText.textContent = text;
  }

  function showMessage(message, isError) {
    msgEl.textContent = message;
    msgEl.classList.add("show");
    msgEl.classList.toggle("error", !!isError);
  }

  function hideMessage() {
    msgEl.classList.remove("show", "error");
    msgEl.textContent = "";
  }

  function showError(message) {
    setStatus("Error");
    showMessage(message, true);
  }

  function scheduleRetry(reason) {
    if (retryTimer) clearTimeout(retryTimer);
    if (retryCount >= RETRY_DELAYS_MS.length) {
      showError(reason + " Will retry at next refresh.");
      return;
    }
    var delay = RETRY_DELAYS_MS[retryCount++];
    setStatus("Retrying in " + Math.round(delay / 1000) + "s");
    // Keep the last good headlines on screen while retrying quietly.
    if (!track.innerHTML) showMessage("Connecting to news backend…", false);
    retryTimer = setTimeout(fetchNews, delay);
  }

  function requestFetch() {
    // context and settings events both fire on load; collapse them into one call.
    if (fetchDebounce) clearTimeout(fetchDebounce);
    fetchDebounce = setTimeout(fetchNews, 300);
  }

  function render(items) {
    if (!items.length) {
      track.innerHTML = "";
      showMessage("No recent news for the configured countries yet.", false);
      return;
    }
    hideMessage();

    var html = items.map(function (it) {
      return '<span class="ticker-item">' +
        '<span class="flag-country">' + escapeHtml(it.groupTitle) + '</span>' +
        '<span class="sep">&bull;</span>' +
        '<span class="headline">' + escapeHtml(it.name) + '</span>' +
        '</span>';
    }).join("");

    track.innerHTML = html + html; // duplicate once for a seamless loop
    var trackWidth = track.scrollWidth / 2;
    var duration = Math.max(20, trackWidth / state.speedPxPerSec);
    track.style.animationDuration = duration + "s";
  }

  function fetchNews() {
    if (!state.boardIds.length) {
      setStatus("No board connected");
      return;
    }

    if (!BACKEND_URL || BACKEND_URL.indexOf("REPLACE_WITH") === 0) {
      showError("Backend URL not configured yet — see comment at top of the script.");
      return;
    }

    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    setStatus("Refreshing…");
    if (!track.innerHTML) showMessage("Loading news…", false);

    var myToken = ++activeFetchToken;
    var controller = window.AbortController ? new AbortController() : null;
    var timeoutTimer = setTimeout(function () {
      if (controller) controller.abort();
    }, REQUEST_TIMEOUT_MS);

    var url = BACKEND_URL.replace(/\/$/, "") +
      "/news?boardIds=" + encodeURIComponent(state.boardIds.join(",")) +
      "&itemLimit=" + encodeURIComponent(state.itemLimit);

    fetch(url, controller ? { signal: controller.signal } : undefined)
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status + " from backend");
        return r.json();
      })
      .then(function (res) {
        clearTimeout(timeoutTimer);
        if (myToken !== activeFetchToken) return;

        if (res && res.error) {
          var detail = res.details ? (typeof res.details === "string" ? res.details : JSON.stringify(res.details)) : "";
          throw new Error(res.error + (detail ? " — " + detail : ""));
        }

        var boards = (res && res.data && res.data.boards) || [];
        var all = [];

        boards.forEach(function (b) {
          (b.groups || []).forEach(function (g) {
            // Countries setting = the BD person's territory. Worldwide news is
            // still shown, but territory stories always come first.
            var inTerritory = state.countries.indexOf(normalizeCountry(bareCountryName(g.title))) !== -1;

            (g.items_page && g.items_page.items || []).forEach(function (item) {
              all.push({
                name: item.name,
                groupTitle: g.title,
                createdAt: item.created_at,
                territory: inTerritory
              });
            });
          });
        });

        all.sort(function (a, b) {
          if (a.territory !== b.territory) return a.territory ? -1 : 1;
          return new Date(b.createdAt) - new Date(a.createdAt);
        });

        retryCount = 0;
        render(all.slice(0, state.itemLimit));
        setStatus("Live · updated " + new Date().toLocaleTimeString());
      })
      .catch(function (err) {
        clearTimeout(timeoutTimer);
        if (myToken !== activeFetchToken) return;
        console.error("Ticker fetch failed", err);
        var msg = (err && err.name === "AbortError")
          ? "Backend did not respond within " + (REQUEST_TIMEOUT_MS / 1000) + "s."
          : "Couldn't load news feed: " + (err && err.message ? err.message : String(err));
        scheduleRetry(msg);
      });
  }

  function scheduleRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function () { retryCount = 0; fetchNews(); }, state.refreshMs);
  }

  if (monday) {
    monday.listen("context", function (res) {
      try {
        var data = res.data || {};
        state.boardIds = data.boardIds || (data.boardId ? [data.boardId] : []);
        requestFetch();
      } catch (err) {
        console.error("context listener failed", err);
        showError("Internal error (context): " + (err && err.message ? err.message : String(err)));
      }
    });

    monday.listen("settings", function (res) {
      try {
        var settings = res.data || {};
        state.countries = parseCountryList(settings.countries);
        if (settings.itemLimit) state.itemLimit = parseInt(settings.itemLimit, 10) || state.itemLimit;
        if (settings.refreshMinutes) state.refreshMs = (parseInt(settings.refreshMinutes, 10) || 5) * 60 * 1000;
        if (settings.speed) state.speedPxPerSec = parseInt(settings.speed, 10) || state.speedPxPerSec;
        requestFetch();
        scheduleRefresh();
      } catch (err) {
        console.error("settings listener failed", err);
        showError("Internal error (settings): " + (err && err.message ? err.message : String(err)));
      }
    });
  } else {
    setStatus("monday SDK failed to load");
  }
})();
</script>

</body>
</html>
